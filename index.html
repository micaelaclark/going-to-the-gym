<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micaela Goes to the Gym</title>
  <link rel="icon" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a237e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gym 💪">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

  <header>
    <h1>Micaela Goes to the Gym 🏃‍♀️</h1>
  </header>

  <nav class="page-tabs">
    <button class="page-tab active" data-page="training" onclick="showPage('training')">Training</button>
  </nav>

  <div id="training-page" class="page-content">
    <div id="goals-panel" class="goals-panel"></div>

    <div id="insights" class="insights-panel hidden">
      <div class="insights-panel-title">Training Insights</div>

      <div id="insights-focus" class="insights-section hidden">
        <div class="insights-section-title">📍 Focus Here <span class="insights-hint">— not hit in 3+ days</span></div>
        <div class="insights-pills"></div>
      </div>

      <div id="insights-recovering" class="insights-section hidden">
        <div class="insights-section-title">⏳ Recovering <span class="insights-hint">— give it rest</span></div>
        <div class="insights-pills"></div>
      </div>

      <div id="insights-ready" class="insights-section hidden">
        <div class="insights-section-title">✨ Recovered &amp; Ready</div>
        <div class="insights-pills"></div>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-bar-top">
        <input type="text" id="exercise-search" placeholder="Search by name or muscle…" oninput="renderStrengthBubbles()">
        <div class="body-filter-btns">
          <button class="filter-btn active" data-filter="all" onclick="setBodyFilter('all')">All</button>
          <button class="filter-btn" data-filter="upper" onclick="setBodyFilter('upper')">Upper</button>
          <button class="filter-btn" data-filter="lower" onclick="setBodyFilter('lower')">Lower</button>
        </div>
      </div>
      <div class="muscle-filter-row">
        <button class="muscle-filter-btn muscle-tag chest" data-muscle="chest" onclick="setMuscleFilter('chest')">chest</button>
        <button class="muscle-filter-btn muscle-tag back" data-muscle="back" onclick="setMuscleFilter('back')">back</button>
        <button class="muscle-filter-btn muscle-tag shoulders" data-muscle="shoulders" onclick="setMuscleFilter('shoulders')">shoulders</button>
        <button class="muscle-filter-btn muscle-tag biceps" data-muscle="biceps" onclick="setMuscleFilter('biceps')">biceps</button>
        <button class="muscle-filter-btn muscle-tag triceps" data-muscle="triceps" onclick="setMuscleFilter('triceps')">triceps</button>
        <button class="muscle-filter-btn muscle-tag core" data-muscle="core" onclick="setMuscleFilter('core')">core</button>
        <button class="muscle-filter-btn muscle-tag quads" data-muscle="quads" onclick="setMuscleFilter('quads')">quads</button>
        <button class="muscle-filter-btn muscle-tag hamstrings" data-muscle="hamstrings" onclick="setMuscleFilter('hamstrings')">hamstrings</button>
        <button class="muscle-filter-btn muscle-tag glutes" data-muscle="glutes" onclick="setMuscleFilter('glutes')">glutes</button>
        <button class="muscle-filter-btn muscle-tag adductors" data-muscle="adductors" onclick="setMuscleFilter('adductors')">adductors</button>
        <button class="muscle-filter-btn muscle-tag abductors" data-muscle="abductors" onclick="setMuscleFilter('abductors')">abductors</button>
        <button class="muscle-filter-btn muscle-tag calves" data-muscle="calves" onclick="setMuscleFilter('calves')">calves</button>
      </div>
    </div>

    <div id="strength-bubbles" class="bubble-grid">
      <p class="empty-state">No workouts yet.</p>
    </div>

    <div id="strength-chart-panel" class="chart-panel hidden">
      <div class="chart-panel-header">
        <span id="chart-panel-title"></span>
        <button class="close-btn" onclick="closeChart()">✕</button>
      </div>
      <div id="running-chart-controls" class="running-controls hidden">
        <div class="run-ctrl-group">
          <button class="run-ctrl-btn active" data-days="all" onclick="setRunningDays('all')">All</button>
          <button class="run-ctrl-btn" data-days="30" onclick="setRunningDays(30)">30d</button>
          <button class="run-ctrl-btn" data-days="7" onclick="setRunningDays(7)">7d</button>
        </div>
        <div class="run-ctrl-group">
          <button class="run-ctrl-btn active" data-metric="both" onclick="setRunningMetric('both')">Both</button>
          <button class="run-ctrl-btn" data-metric="distance" onclick="setRunningMetric('distance')">Distance</button>
          <button class="run-ctrl-btn" data-metric="speed" onclick="setRunningMetric('speed')">Speed</button>
        </div>
      </div>
      <canvas id="strength-chart"></canvas>
      <div id="strength-chart-notes" class="chart-notes hidden"></div>
    </div>
  </div>

  <div id="cycle-page" class="page-content hidden">
    <div id="cycle-phase-banner" class="cycle-phase-banner card"></div>

    <div id="cycle-food-card" class="card hidden">
      <div class="food-rec-label">Today's Nutrition Focus</div>
      <div class="food-rec-name"></div>
      <div class="food-rec-why"></div>
    </div>

    <div class="card cycle-calendar">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="prevCalMonth()">&#8249;</button>
        <span id="cal-month-label" class="cal-month-label"></span>
        <button class="cal-nav-btn" onclick="nextCalMonth()">&#8250;</button>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
    </div>

    <div id="cycle-length-panel" class="card hidden">
      <div class="cycle-length-header">Cycle Length History</div>
      <canvas id="cycle-length-chart"></canvas>
    </div>

    <div class="cycle-footer">
      <div id="cycle-legend" class="cycle-legend"></div>
      <button id="cycle-log-btn" class="cycle-log-btn" onclick="logPeriod()">🩸 Log Period Start Today</button>
    </div>
  </div>

  <script src="/static/app.js"></script>

  <button id="log-fab" class="log-fab" onclick="openLogModal()" aria-label="Log workout">+</button>

  <div id="log-modal" class="log-modal hidden" onclick="if(event.target===this)closeLogModal()">
    <div class="log-modal-content">
      <div class="log-modal-header">
        <span>Log Workout</span>
        <button class="close-btn" onclick="closeLogModal()">✕</button>
      </div>

      <div class="log-tabs">
        <button class="log-tab active" data-tab="strength" onclick="setLogTab('strength')">Strength</button>
        <button class="log-tab" data-tab="run" onclick="setLogTab('run')">Run</button>
        <button class="log-tab" data-tab="cardio" onclick="setLogTab('cardio')">Cardio</button>
        <button class="log-tab" data-tab="yoga" onclick="setLogTab('yoga')">Yoga</button>
        <button class="log-tab" data-tab="stretch" onclick="setLogTab('stretch')">Stretch</button>
      </div>

      <form id="log-form-strength" class="log-form" onsubmit="submitLog(event, 'strength')">
        <label>Date <input type="date" name="date" required></label>
        <label>Exercise <input type="text" name="exercise" required placeholder="e.g. Chest Press"></label>
        <label>Weight (lbs) <input type="number" name="weight" step="0.5" value="0"></label>
        <label>Set 1 reps <input type="number" name="rep1" required></label>
        <label>Set 2 reps <input type="number" name="rep2"></label>
        <label>Set 3 reps <input type="number" name="rep3"></label>
        <label><input type="checkbox" name="timed"> Timed exercise (reps = seconds)</label>
        <label>Muscles (comma-separated)
          <input type="text" name="muscles" placeholder="e.g. chest, triceps, shoulders">
        </label>
        <label>Note (optional) <input type="text" name="note" placeholder="e.g. felt heavy today"></label>
        <button type="submit">Save</button>
      </form>

      <form id="log-form-run" class="log-form hidden" onsubmit="submitLog(event, 'run')">
        <label>Date <input type="date" name="date" required></label>
        <label>Distance (mi) <input type="number" name="distance" step="0.01" required></label>
        <label>Pace or Total Time
          <div class="pace-row">
            <input type="number" name="paceMin" placeholder="min" min="0">
            <span>:</span>
            <input type="number" name="paceSec" placeholder="sec" min="0" max="59">
            <select name="paceType">
              <option value="pace">per mile</option>
              <option value="total">total time</option>
            </select>
          </div>
        </label>
        <label>Note (optional) <input type="text" name="note" placeholder="e.g. hill run"></label>
        <button type="submit">Save</button>
      </form>

      <form id="log-form-cardio" class="log-form hidden" onsubmit="submitLog(event, 'cardio')">
        <label>Date <input type="date" name="date" required></label>
        <label>Type <input type="text" name="type" required placeholder="e.g. elliptical, stair climber"></label>
        <label>Duration (min) <input type="number" name="duration" required></label>
        <label>Level (optional) <input type="number" name="level" step="0.5"></label>
        <label>Note (optional) <input type="text" name="note"></label>
        <button type="submit">Save</button>
      </form>

      <form id="log-form-yoga" class="log-form hidden" onsubmit="submitLog(event, 'yoga')">
        <label>Date <input type="date" name="date" required></label>
        <label>Intensity
          <select name="intensity">
            <option value="moderate">Moderate</option>
            <option value="light">Light</option>
            <option value="intense">Intense</option>
          </select>
        </label>
        <label>Note (optional) <input type="text" name="note"></label>
        <button type="submit">Save</button>
      </form>

      <form id="log-form-stretch" class="log-form hidden" onsubmit="submitLog(event, 'stretch')">
        <label>Date <input type="date" name="date" required></label>
        <label>Note (optional) <input type="text" name="note" placeholder="poses, duration, etc"></label>
        <button type="submit">Save</button>
      </form>

      <div id="pending-entries" class="pending-section hidden">
        <div class="pending-title">Pending (not yet synced to repo)</div>
        <div id="pending-list"></div>
        <button class="pending-export" onclick="exportPending()">Copy JSON to share with Claude</button>
      </div>
    </div>
  </div>

</body>
</html>
